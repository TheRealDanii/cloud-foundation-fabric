# yaml-language-server: $schema=../../stages/2-project-factory/schemas/project.schema.json

# Instance project: holds the Secure Source Manager instance, the repositories
# and their repository-level service accounts, and the automation seat for
# this template, which spans this project and the build project.

# TODO: edit and uncomment the following line to create the project in a folder
# parent: $folder_ids:shared

# project id can be customized here if file name cannot be changed
# name: dev-build-ssm-0

services:
  - iam.googleapis.com
  - privateca.googleapis.com
  # enabling this through the factory also creates the service agent and
  # grants it roles/securesourcemanager.serviceAgent, which must happen
  # before the first instance is created
  - securesourcemanager.googleapis.com

automation:
  # TODO: edit the automation project and optionally edit resource names
  project: $project_ids:iac-0
  service_accounts:
    rw:
      description: Read/write automation service account for the SSM template.
  bucket:
    # this reuses the existing stage state bucket and creates a folder in it
    name: iac-stage-state
    create: false
    managed_folders:
      dev-build-ssm-0:
        iam:
          roles/storage.objectCreator:
            # the project id in the service account ref matches this file name
            - $iam_principals:service_accounts/dev-build-ssm-0/automation/rw
          roles/storage.objectViewer:
            - $iam_principals:service_accounts/dev-build-ssm-0/automation/rw

iam:
  roles/viewer:
    - automation/rw
  # the instance, the repositories and their IAM
  roles/securesourcemanager.admin:
    - automation/rw
  # the repository-level service accounts and their IAM
  roles/iam.serviceAccountAdmin:
    - automation/rw
  roles/resourcemanager.projectIamAdmin:
    - automation/rw

org_policies:
  # the repository-level service accounts live here and the builds they
  # create run in the build project; only the project hosting the service
  # account needs this
  iam.disableCrossProjectServiceAccountUsage:
    rules:
      - enforce: false

# the service agent signs the instance certificate through the CA pool, which
# must be in the instance region; the factory places this grant because the
# member string embeds the project number, and needs a delegated
# projectIamAdmin on the CA project (see README, CA pool section)
service_agents_project_bindings:
  ssm-certificate-requester:
    service: sourcemanager
    # TODO: edit to the project holding the CA pool
    project: $project_ids:dev-sec-core
    role: roles/privateca.certificateRequester

# TODO: edit or comment VPC-SC perimeter membership; a private instance inside
# a perimeter requires the CA pool
vpc_sc:
  perimeter_name: $vpc_sc_perimeters:default
  is_dry_run: false
